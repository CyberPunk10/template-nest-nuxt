name: CI

on:
  # Push — только по веткам-вариантам шаблона. Для остальных веток прогон
  # даёт PR-триггер: иначе на один и тот же код CI запускался бы дважды.
  push:
    branches: [main, auth-session, postgres-prisma]
  pull_request:

# Новый push в ту же ветку делает предыдущий прогон бессмысленным.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node ставится первым, чтобы pnpm работал на версии из .nvmrc,
      # а не на системном Node раннера.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Версию pnpm берёт из packageManager в package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Тот же шаг, что и у пользователя шаблона: без .env не соберутся docs.
      - run: pnpm env:copy

      # Скрипты lint запускаются с --fix и в CI молча исправили бы ошибки.
      # Поэтому исправленное считаем провалом: значит, в коммит попал
      # непроверенный линтером код.
      - run: pnpm lint
      - run: git diff --exit-code

      - run: pnpm type-check
      - run: pnpm build

      - name: Audit dependencies
        run: pnpm audit
        continue-on-error: true

      - run: pnpm test
      - run: pnpm test:e2e

      # pnpm dev не завершается сам: запускаем в фоне и ждём ответа
      # от каждого сервера. Процессы остановит раннер по завершении job.
      - name: Dev mode smoke test
        run: |
          pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          # Адреса берутся из .env, которые создал env:copy.
          env_value() { grep "^$2=" "$1" | cut -d= -f2-; }
          backend="http://localhost:$(env_value apps/backend/.env PORT)"
          frontend="http://localhost:$(env_value apps/frontend/.env PORT)"
          docs="$(env_value apps/frontend/.env NUXT_PUBLIC_DOCS_URL)"
          for url in \
            "$backend/health" \
            "$frontend/" \
            "$frontend/api/backend/health" \
            "$docs"; do
            curl -fsS -o /dev/null --retry 60 --retry-delay 2 --retry-all-errors "$url" \
              || { cat "$RUNNER_TEMP/dev.log"; exit 1; }
            echo "ok $url"
          done

      # Отдельные тесты для throttle.
      - run: pnpm --filter @repo/backend test:e2e:throttle

  # Образы собираются здесь, а не на сервере: сборке нужно около 3.5 ГБ
  # памяти, а работающему стеку — меньше гигабайта. Сервер только
  # скачивает готовое.
  images:
    needs: checks
    # Только push: список веток задан в триггере выше, а на PR образы
    # публиковать незачем — ветка ещё не слита.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Фиксированное имя проекта — чтобы знать, как Compose назовёт образы.
      COMPOSE_PROJECT_NAME: app
    steps:
      - uses: actions/checkout@v7

      # Compose требует все env_file, а .env в репозитории нет.
      # Секреты в образ не попадают: .env исключены в .dockerignore.
      - run: node scripts/copy-env-cli.mjs

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile и контексты сборки Compose берёт из docker-compose.yml.
      - run: docker compose build backend frontend nginx

      # Два тега: <ветка>-<sha> указывает на конкретный коммит и нужен для
      # отката, <ветка> — всегда на последнюю сборку.
      # GHCR принимает имена только в нижнем регистре.
      - name: Push images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA::7}"
          for service in backend frontend nginx; do
            for tag in "$branch-$sha" "$branch"; do
              docker tag "app-$service" "$prefix/$service:$tag"
              docker push "$prefix/$service:$tag"
            done
          done

  # Отдельным job, а не шагом в images: проверка запуска нестабильнее сборки
  # по своей природе, и «Re-run failed jobs» должен перезапускать только её.
  docker-smoke:
    needs: images
    if: github.event_name == 'push'
    name: 'Docker smoke: prod stack boots & healthy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: app
    steps:
      - uses: actions/checkout@v7

      # Те же env, что и при сборке: без них Compose не примет конфигурацию.
      - run: node scripts/copy-env-cli.mjs

      # Сеть объявлена в compose как external, то есть создаётся снаружи.
      # Локально это делает predocker, но его целиком звать нельзя: там
      # интерактивная проверка портов, которой в CI некому отвечать.
      - name: Create external network
        run: node -e "import('./scripts/ensure-network.mjs').then(m => m.ensureNetwork())"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Проверяем то, что опубликовали, а не собственную пересборку: образы
      # подменяются в локальном теге, которого ждёт Compose.
      - name: Pull published images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          for service in backend frontend nginx; do
            docker pull "$prefix/$service:$tag"
            docker tag "$prefix/$service:$tag" "app-$service"
          done

      # Сервисы перечислены явно: docs-builder публикуется не как образ,
      # а как статика внутри nginx, и compose полез бы собирать его с нуля.
      # --wait держит команду до готовности healthcheck'ов, объявленных
      # в Dockerfile каждого сервиса. Таймаут больше start-period бэкенда (60s).
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180 backend frontend nginx

      # Все адреса идут через nginx — так же, как к ним придёт пользователь.
      - name: Check routes
        run: |
          port="$(grep '^NGINX_HOST_PORT=' .env | cut -d= -f2-)"
          base="http://localhost:$port"
          for path in / /login /api/backend/health /dev/docs/; do
            curl -fsS -o /dev/null --retry 20 --retry-delay 2 --retry-all-errors "$base$path"
            echo "ok $base$path"
          done

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop stack
        if: always()
        run: docker compose down -v
