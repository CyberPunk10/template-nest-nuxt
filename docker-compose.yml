# Один compose-файл на оба способа запуска, разделение — через профили:
#
#   pnpm db:up      → только postgres, для `pnpm dev`
#   pnpm docker:up  → профиль `app`: nginx, backend, frontend + та же БД
#
# У postgres профиля нет намеренно: БД нужна в любом случае.
# Профиль `app` собирается в production-конфигурации; dev-вариант
# с hot-reload добавится сюда же отдельным профилем.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Порт публикуется и в Docker-режиме: приложениям внутри сети он не нужен
    # (они ходят по имени сервиса), но с хоста к БД удобно подключаться
    # клиентом и запускать миграции/сиды через `pnpm --filter backend ...`.
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

  nginx:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      # Статику документации собирает apps/docs/Dockerfile — она приезжает сюда
      # готовым build-контекстом, а не отдельным сервисом: Compose сам собирает
      # docs-builder первым и подставляет его результат в COPY --from=docs.
      additional_contexts:
        docs: service:docs-builder
    restart: unless-stopped
    ports:
      - '${NGINX_HOST_PORT:?}:${NGINX_INTERNAL_PORT:?}'
    environment:
      NGINX_INTERNAL_PORT: '${NGINX_INTERNAL_PORT:?}'
      FRONTEND_INTERNAL_PORT: '${FRONTEND_INTERNAL_PORT:?}'
      BACKEND_INTERNAL_PORT: '${BACKEND_INTERNAL_PORT:?}'
    depends_on:
      - frontend
      - backend
    networks:
      - app

  docs-builder:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    # Не поднимаем контейнер: сервис нужен только как источник образа.
    scale: 0
    # Сеть указана не ради связи (контейнера нет), а чтобы Compose
    # не заводил для этого сервиса отдельную сеть по умолчанию.
    networks:
      - app

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    expose:
      - '${BACKEND_INTERNAL_PORT:?}'
    env_file: apps/backend/.env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: '${BACKEND_INTERNAL_PORT:?}'
      # Снаружи фронтенд приходит через прокси, а не со своего порта, —
      # поэтому origin это адрес сайта (PUBLIC_ORIGIN в корневом .env).
      # Порт 80 в origin не пишется — браузер его тоже опускает.
      CORS_ORIGIN: '${PUBLIC_ORIGIN:?}'
      # Подключение к БД переопределяется здесь, а не берётся из
      # apps/backend/.env: тот файл описывает локальный запуск (`pnpm dev`,
      # хост и проброшенный порт), а внутри Docker-сети Postgres доступен по
      # имени сервиса на 5432. Логин/пароль/база берутся из корневого .env —
      # из того же места, что и у сервиса postgres выше, чтобы значения
      # не могли разойтись.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - '${FRONTEND_INTERNAL_PORT:?}'
    env_file: apps/frontend/.env
    environment:
      NUXT_PUBLIC_APP_ENV: production
      PORT: '${FRONTEND_INTERNAL_PORT:?}'
      # Внутри сети backend доступен только по имени сервиса, не по localhost.
      # Префикс NUXT_ обязателен — без него Nuxt переменную игнорирует.
      NUXT_BACKEND_URL: http://backend:${BACKEND_INTERNAL_PORT:?}
      # Относительный путь: доки отдаёт тот же прокси, что и фронтенд.
      NUXT_PUBLIC_DOCS_URL: /dev/docs/
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    # Явное имя сети — без него Docker генерирует имя из папки проекта.
    # Фиксированное имя нужно когда к сети нужно подключить контейнеры
    # из другого compose-файла или проекта:
    #   docker network connect $COMPOSE_NETWORK_NAME <container>
    # или через external: true в другом compose.
    # Сеть создаётся не Compose, а скриптами `pnpm db:up` / `pnpm docker:up`.
    name: ${COMPOSE_NETWORK_NAME:?}
    external: true
