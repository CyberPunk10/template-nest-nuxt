packages:
  - 'apps/*'
  - 'packages/*'
engineStrict: true
# Skip versions published less than a day ago (minutes).
minimumReleaseAge: 1440
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
